# Netlify 部署配置
# - 静态资源（前端）发布到 CDN：publish = "static"
# - FastAPI 打包为目录式 Serverless Function：netlify/functions/api/
#   （依赖安装进函数目录内，随函数 zip 一起打包）
# - 演示模式（DEMO_MODE=true）使用内存数据源，无需外部数据库
# 注意：必须通过 Git 连接或 Netlify CLI 部署；Netlify Drop 拖拽部署
#       不会执行构建、不会打包 Functions、也不会读取本文件。

[build]
  command = "pip install -r requirements.netlify.txt -t netlify/functions/api --no-compile"
  publish = "static"

[build.environment]
  PYTHON_VERSION = "3.12"

[functions]
  directory = "netlify/functions"

# API 网关转发：前端同源调用 /api/*，由函数处理
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# 单页应用兜底（前端为哈希路由，仅需根路径）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
