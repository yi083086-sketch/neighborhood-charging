<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邻里充电运营平台</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <!-- 登录页 -->
  <div id="login-view" class="login-wrap hidden">
    <div class="login-card">
      <div class="login-logo">⚡</div>
      <h1>邻里充电运营平台</h1>
      <p class="login-sub">社区充电一体化运营工作台</p>
      <form id="login-form">
        <label>用户名
          <input id="login-username" autocomplete="username" required maxlength="64">
        </label>
        <label>密码
          <input id="login-password" type="password" autocomplete="current-password" required maxlength="128">
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">登 录</button>
      </form>
      <div id="demo-accounts" class="demo-accounts hidden">
        <div class="demo-title">演示账号（点击快速填充）</div>
        <div id="demo-list" class="demo-list"></div>
      </div>
    </div>
  </div>

  <!-- 工作台 -->
  <div id="app-view" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-logo">⚡</span> 邻里充电</div>
      <nav id="nav-menu" class="nav-menu"></nav>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar"></div>
          <div class="user-meta">
            <div class="user-name" id="user-name"></div>
            <div class="user-role" id="user-role"></div>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" id="logout-btn">退出登录</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <h2 id="page-title"></h2>
        <div class="topbar-right" id="topbar-right"></div>
      </header>
      <main id="page-content" class="content"></main>
    </div>
  </div>

  <!-- 全局弹层 -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
